# OpenHands Agent Canvas backend, per https://docs.openhands.dev/openhands/usage/agent-canvas/backend-setup/docker
#
# Not running --privileged, so the agent cannot launch its own nested sandbox containers
# (a stated limitation of the unprivileged setup in the docs above). Re-add
# `privileged: true` under the service below if that capability is needed later.
services:
  openhands:
    image: ghcr.io/openhands/agent-canvas:latest
    container_name: openhands
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_OPENHANDS_8000
    volumes:
      - settings:/home/openhands/.openhands
      - projects:/projects
    ports:
      - 8000:8000
    healthcheck:
      # /health is proxied by the static server (this image's entrypoint) to the
      # agent-server backend -- confirmed by inspecting entrypoint.sh, not documented
      # on the page above.
      test:
        - CMD-SHELL
        - 'curl -fsS http://127.0.0.1:8000/health || exit 1'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  settings:
  projects:
