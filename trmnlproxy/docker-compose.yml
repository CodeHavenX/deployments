# Images are pushed to the homelab's private Docker Registry by deploy-trmnlproxy.yml. Set
# HOMELAB_REGISTRY_HOST if it's not reachable at the default registry.home.lab.
services:
  backend:
    image: '${HOMELAB_REGISTRY_HOST:-registry.home.lab}/monorepo/trmnlproxy-backend:latest'
    restart: unless-stopped
    pull_policy: always
    environment:
      - SERVICE_FQDN_BACKEND_9292
      # CORS: only the frontend's Coolify-generated domain may call the backend.
      - TRMNLPROXY_ALLOWED_HOST=${SERVICE_FQDN_FRONTEND}
      # Tells the entrypoint's cert importer where to look -- matches the mounts below.
      - INTERNAL_CA_CERT_DIR=/certs
    volumes:
      # Drop any internal/private CA certificates (.crt or .pem) that back-end HTTPS calls need
      # to trust (Immich today, other self-hosted services later) into ./certs on the host --
      # the container imports every file found here into its JVM trust store on startup.
      # No image rebuild or plugin-specific code needed to trust a new CA.
      - ./certs:/certs
      - /opt/coolify-proxy-cert/root_ca.crt:/certs/homelab-root-ca.crt:ro
    healthcheck:
      test:
        - CMD-SHELL
        - 'curl -fsS http://localhost:9292/health || exit 1'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  frontend:
    image: '${HOMELAB_REGISTRY_HOST:-registry.home.lab}/monorepo/trmnlproxy-frontend:latest'
    restart: unless-stopped
    pull_policy: always
    environment:
      - SERVICE_FQDN_FRONTEND_80
      - RUNTIME_SETTING_BACKEND__URL=${SERVICE_URL_BACKEND}
    healthcheck:
      # nginx:alpine has no curl, but busybox wget is available.
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=1
        - --spider
        - http://localhost/
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
