# The image is pushed to the homelab registry by MonoRepo's buildRelease-main.yml, and the deploy
# engine moves :staging to each new build (trmnlproxy/deploy.toml). Set HOMELAB_REGISTRY_HOST if
# it's not reachable at the default registry.xupulab.com.
services:
  backend:
    image: '${HOMELAB_REGISTRY_HOST:-registry.xupulab.com}/monorepo/trmnlproxy-backend:staging'
    restart: unless-stopped
    pull_policy: always
    environment:
      - SERVICE_FQDN_BACKEND_9292
    healthcheck:
      test:
        - CMD-SHELL
        - 'curl -fsS http://127.0.0.1:9292/health || exit 1'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
