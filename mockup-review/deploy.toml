# What Mockup Review ships where. Read by the deploy engine in CodeHavenX/MonoRepo (scripts/deploy/,
# format in its README); MonoRepo's deploy-staging.yml runs it after every main build.
schema = 1

[artifacts.server]
kind = "docker-image"
image = "monorepo/mockup-review"

[releases.service]
artifacts = ["server"]

# Mockup Review has a single instance, so its staging channel is the live one. MonoRepo PR builds
# publish review pages to it (mockup-review/scripts/publish.sh), at the URL in MonoRepo's
# MOCKUP_REVIEW_SERVICE_URL variable. docker-compose.yml pulls :staging, which the engine moves to
# each new build and then redeploys.
[releases.service.channels.staging]
provider = "coolify"
trigger = "on-build"
registry = "homelab"
post_deploy = [
  { http = "https://server-m3ck3hwx5hbgyidx6igajgem.apps-x64-01.xupulab.com/health", expect = 200, timeout_s = 300 },
]
# The build each image is actually running, read by MonoRepo's `deploy.py status`.
version_urls = { server = "https://server-m3ck3hwx5hbgyidx6igajgem.apps-x64-01.xupulab.com/version" }

[releases.service.channels.staging.coolify]
instance = "local"
resource_uuids = ["m3ck3hwx5hbgyidx6igajgem"]
