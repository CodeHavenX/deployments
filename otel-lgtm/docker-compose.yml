# Grafana LGTM (Loki, Grafana, Tempo, Mimir/Prometheus) in one container: the OpenTelemetry
# collector the back-ends export traces and metrics to (MonoRepo #967), and the Grafana UI to read
# them. A single-container dev/demo image, fine for staging; if it outgrows it, split it into
# Tempo/Mimir/Loki without code changes (the back-ends only know the OTLP endpoint).
#
# Access:
# - Grafana is reachable on the LAN through Coolify's proxy (SERVICE_FQDN_LGTM_3000). Don't route
#   it through the Cloudflare tunnel: the image signs everyone in anonymously.
# - OTLP (4317 gRPC, 4318 HTTP) has no host ports and no domain. Back-ends reach it over Coolify's
#   predefined network: turn on "Connect To Predefined Network" for this resource and for each
#   back-end (each needs a redeploy to join), then point the back-end at http://lgtm:4318 through
#   its <APP>_TELEMETRY_OTLP_ENDPOINT (edifikana, finances, mockup-review and trmnlproxy compose
#   files). Use the bare service name: Coolify suffixes the container name with the deploy time
#   (lgtm-<uuid>-<timestamp>), so lgtm-<uuid> doesn't resolve. Every resource on the predefined
#   network shares that namespace, so no other resource may have a service named lgtm.
#
# Traces, metrics and logs are kept on the volume below so a redeploy doesn't wipe them. Retention
# is the image's default. Nothing here is backed up.
services:
  lgtm:
    image: 'grafana/otel-lgtm:0.37.0'
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_LGTM_3000
    volumes:
      - lgtm-data:/data
    healthcheck:
      # Grafana's health route. Grafana starts last, after the collector and the back-ends, so a
      # passing check means the whole stack is up. Long start_period: first boot takes a while.
      test:
        - CMD-SHELL
        - 'curl -fsS http://127.0.0.1:3000/api/health || exit 1'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  lgtm-data:
