# What DeliveryBoard ships where. Read by the deploy engine in CodeHavenX/MonoRepo (scripts/deploy/,
# format in its README); MonoRepo's deploy-staging.yml runs it after every main build.
schema = 1

[artifacts.backend]
kind = "docker-image"
image = "monorepo/deliveryboard-backend"

[releases.service]
artifacts = ["backend"]

# DeliveryBoard has a single instance, so its staging channel is the live one. docker-compose.yml
# pulls :staging, which the engine moves to each new build and then redeploys.
#
# The engine only moves :staging while deploying an enabled channel, so the first :staging comes
# from the first deploy after enabling, not before it: Coolify's own first deploy of the new
# resource fails ("not found") until then, which is expected. That first deploy is either the next
# main build that rebuilds the image, or a manual one for a build that already exists:
#   gh workflow run deploy-staging.yml -f sha=<a main commit whose image was built> \
#     -f images=monorepo/deliveryboard-backend
# CI pushes nothing to the board: it reads the deploys the engine records on GitHub.
[releases.service.channels.staging]
provider = "coolify"
trigger = "on-build"
registry = "homelab"
post_deploy = [
  { http = "https://backend-g9nxeypvfhidzbovmvpvayal.apps-x64-01.xupulab.com/health", expect = 200, timeout_s = 300 },
]
# The build each image is actually running, read by MonoRepo's `deploy.py status`.
version_urls = { backend = "https://backend-g9nxeypvfhidzbovmvpvayal.apps-x64-01.xupulab.com/version" }

[releases.service.channels.staging.coolify]
instance = "local"
resource_uuids = ["g9nxeypvfhidzbovmvpvayal"]
