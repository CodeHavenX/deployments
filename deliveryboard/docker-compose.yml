# DeliveryBoard: one page of every MonoRepo app's open changes, CI and deployments
# (MonoRepo deliveryboard/README.md). The image is pushed to the homelab registry by MonoRepo's
# buildRelease-main.yml, and the deploy engine moves :staging to each new build
# (deliveryboard/deploy.toml). Set HOMELAB_REGISTRY_HOST if it's not reachable at the default
# registry.xupulab.com.
#
# Required secret (set via Coolify's environment UI, not committed here):
#   DELIVERYBOARD_FORGE_TOKEN  - GitHub fine-grained token with read access to MonoRepo's pull
#                                requests, actions, contents and deployments (unauthenticated reads
#                                allow only 60 an hour)
#
# Telemetry (MonoRepo #967) is on: the deployment alerts (MonoRepo #1117,
# scripts/deploy/observability/alerts/deployment-*.json) watch the gauges the board exports. It
# needs "Connect To Predefined Network" on in Coolify for this resource, like the other back-ends
# (see otel-lgtm/docker-compose.yml).
#   DELIVERYBOARD_TELEMETRY_ENABLED       - false to stop exporting (the alerts then see no data)
#   DELIVERYBOARD_TELEMETRY_OTLP_ENDPOINT - the otel-lgtm resource's OTLP/HTTP URL; default
#                                           http://lgtm:4318
#
# Nothing is kept in the container: the board reads everything from GitHub (recorded deploys, main's
# build artifact) or checks it live, so a redeploy loses nothing.
services:
  backend:
    image: '${HOMELAB_REGISTRY_HOST:-registry.xupulab.com}/monorepo/deliveryboard-backend:staging'
    restart: unless-stopped
    pull_policy: always
    environment:
      - SERVICE_FQDN_BACKEND_9292
      - DELIVERYBOARD_FORGE_REPOSITORY=CodeHavenX/MonoRepo
      - DELIVERYBOARD_FORGE_TOKEN=${DELIVERYBOARD_FORGE_TOKEN}
      - DELIVERYBOARD_TELEMETRY_ENABLED=${DELIVERYBOARD_TELEMETRY_ENABLED:-true}
      - DELIVERYBOARD_TELEMETRY_OTLP_ENDPOINT=${DELIVERYBOARD_TELEMETRY_OTLP_ENDPOINT:-http://lgtm:4318}
      - DELIVERYBOARD_TELEMETRY_ENVIRONMENT=internal
    healthcheck:
      test:
        - CMD-SHELL
        - 'curl -fsS http://127.0.0.1:9292/health || exit 1'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
