# What Finances ships where. Read by the deploy engine in CodeHavenX/MonoRepo (scripts/deploy/,
# format in its README); MonoRepo's deploy-staging.yml runs it after every main build.
schema = 1

[artifacts.backend]
kind = "docker-image"
image = "monorepo/finances-backend"

[releases.service]
artifacts = ["backend"]

# Finances has a single instance, so its staging channel is the live one. docker-compose.yml pulls
# :staging, which the engine moves to each new build and then redeploys.
[releases.service.channels.staging]
provider = "coolify"
trigger = "on-build"
registry = "homelab"
post_deploy = [
  { http = "https://backend-fus29cb7dtl7zuuot7ufswwj.apps-x64-01.xupulab.com/health", expect = 200, timeout_s = 300 },
]

[releases.service.channels.staging.coolify]
instance = "local"
resource_uuids = ["fus29cb7dtl7zuuot7ufswwj"]
